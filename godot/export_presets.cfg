; Android 내보내기 설정 (주인: C — TECH_SPEC 13.1.1)
; 서비스 결합 디버그 APK. 기존 A 시연 APK와 이름·패키지를 분리한다. 최종 패키지 이름은 PRD Q2에서 확정한다.
[preset.0]

name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="forest_tour_v3/*, assets/textures/v2/sky_ph.png, assets/textures/v2/sky_v2.png, assets/textures/cards/card_log_fallen*"
export_path="../build/좀비탈출_서비스_디버그.apk"

[preset.0.options]

gradle_build/use_gradle_build=true
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
package/unique_name="com.lightnine999.zombierunner.serviceui"
package/name="좀비탈출 서비스 검증"
version/code=1
version/name="0.0.1"
screen/immersive_mode=true

